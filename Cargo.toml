[package]
name = "vitrallis-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A small portable graphical launcher for embedded Linux"
repository = "https://github.com/csd113/Vitrallis-Shell"
license = "LicenseRef-Proprietary"
keywords = ["launcher", "embedded", "sdl2"]
categories = ["gui"]
publish = false

[[bin]]
name = "vitrallis"
path = "src/main.rs"

[workspace]
members = [".", "crates/vitrallis-native", "apps/terminal", "apps/notepad", "apps/files"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0-beta4"
edition = "2024"
rust-version = "1.91"

[dependencies]
vitrallis-native.workspace = true
sdl2.workspace = true
font8x8.workspace = true
serde_json.workspace = true
png.workspace = true
semver.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true

[workspace.dependencies]
vitrallis-native = { path = "crates/vitrallis-native" }
libc = "0.2.189"
vt100 = "0.16.2"
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
serde_json = "1.0.151"
serde = "1.0.229"
# Parse the complete manifest v1 TOML grammar without executing Python.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
# Standards-compliant version precedence and in-process artifact verification.
semver = "1.0.28"
sha2 = { version = "0.11.0", default-features = false }
png = "0.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
