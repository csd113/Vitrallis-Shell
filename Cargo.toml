[package]
name = "vitrallis-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A small portable graphical launcher for embedded Linux"
repository = "https://github.com/csd113/Vitrallis-Shell"
license = "LicenseRef-Proprietary"
keywords = ["launcher", "embedded", "sdl2"]
categories = ["gui"]
publish = false

[[bin]]
name = "vitrallis"
path = "src/main.rs"

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0-beta2.3"
edition = "2024"
rust-version = "1.91"

[dependencies]
sdl2.workspace = true
font8x8.workspace = true
serde_json.workspace = true
png.workspace = true
semver.workspace = true
sha2.workspace = true
serde.workspace = true
toml.workspace = true

[workspace.dependencies]
sdl2 = { version = "0.38.0", features = ["use-pkgconfig"] }
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
serde_json = "1.0.151"
serde = "1.0"
# Parse the complete manifest v1 TOML grammar without executing Python.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# Standards-compliant version precedence and in-process artifact verification.
semver = "1.0"
sha2 = { version = "0.11", default-features = false }
# PNG 0.18 requires bitflags 2, conflicting with SDL2 and strict duplicate checks.
# See docs/dependencies.md for the reviewed migration blockers.
png = "=0.17.16"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
