name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.91.0", "1.91.1"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host native libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config python3-tk
      - name: Rust 1.91 baseline
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy --component rustfmt
      - name: Validate owned code
        run: sh scripts/validate.sh
