name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ["1.99.0", "stable"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host native libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config python3-tk python3-venv python3-packaging lua5.3
      - name: Install selected Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy --component rustfmt
      - name: Validate owned code
        run: |
          # App Center fails closed when a same-user process cannot be inspected.
          # Exclude unrelated runner processes while keeping all fixture processes
          # visible. Use the unprivileged runner user and private fixture modes.
          sudo unshare --pid --fork --mount-proc --kill-child \
            sudo --user="$(id -un)" -- \
              env HOME="$HOME" PATH="$PATH" \
                RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
                CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
                RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
                sh -c 'umask 077; exec sh scripts/validate.sh'
