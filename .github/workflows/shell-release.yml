name: Build shell release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  shell:
    runs-on: ubuntu-24.04
    # Debian 12 establishes the release ABI contract, independent of runner libc.
    container: rust:1.91.1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-dev pkg-config python3 python3-tk gh
          rustup component add rustfmt clippy
          # The mounted checkout is owned by the host runner, not container root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate shell
        run: sh scripts/validate.sh
      - name: Package shell only
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 scripts/package-shell-release.py
          --binary target/release/vitrallis
          --target x86_64-unknown-linux-gnu
          --output target/shell-release
          --tag "$RELEASE_TAG"
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" target/shell-release/*
          --verify-tag --draft --title "$RELEASE_TAG"
          --notes "Vitrallis Shell executable and SHA-256 checksum. Requires Linux glibc 2.36+ and SDL2 2.26.5+. Review and test artifacts before publishing."
