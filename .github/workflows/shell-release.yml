name: Build shell release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  shell:
    runs-on: ubuntu-24.04
    # Debian 12 establishes the release ABI contract, independent of runner libc.
    container: rust:1.91.1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-dev pkg-config python3 python3-tk python3-venv python3-packaging gh
          rustup component add rustfmt clippy
          # The mounted checkout is owned by the host runner, not container root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate shell
        run: sh scripts/validate.sh
      - name: Build shared Arti process
        run: sh scripts/build-arti.sh
      - name: Package shell and native applications
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          transition=
          if [ "$RELEASE_TAG" = v0.1.0-beta4 ]; then transition=--transition-bundle; fi
          python3 scripts/package-shell-release.py \
            --bin-dir target/release \
            --target x86_64-unknown-linux-gnu \
            --output target/shell-release \
            --tag "$RELEASE_TAG" $transition
          if [ "$RELEASE_TAG" = v0.1.0-beta4 ]; then export VITRALLIS_TEST_FOUR_FILE_SOURCE=1; fi
          VITRALLIS_TEST_UPDATE_BUNDLE="$PWD/target/shell-release/vitrallis-x86_64-unknown-linux-gnu-glibc2.36-v2.vtrbundle" \
          VITRALLIS_TEST_UPDATE_VERSION="${RELEASE_TAG#v}" \
            cargo test --locked -p vitrallis-shell release_bundle_upgrade_probe -- --nocapture
      - name: Build and validate the ARMv7 shell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          QEMU_CPU: cortex-a8
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libsdl2-dev:armhf qemu-user
          rustup target add armv7-unknown-linux-gnueabihf
          cargo build --locked --release --workspace --all-features --target armv7-unknown-linux-gnueabihf
          sh scripts/build-arti.sh armv7-unknown-linux-gnueabihf target/armv7-unknown-linux-gnueabihf/release
          SDL_VIDEODRIVER=dummy qemu-arm target/armv7-unknown-linux-gnueabihf/release/vitrallis --demo --size 480x272 --screenshot target/arm-frame.bmp
          for app in vitrallis-terminal vitrallis-notepad vitrallis-files; do
            SDL_VIDEODRIVER=dummy qemu-arm "target/armv7-unknown-linux-gnueabihf/release/$app" --size 480x272 --smoke-test
          done
          transition=
          if [ "$RELEASE_TAG" = v0.1.0-beta4 ]; then transition=--transition-bundle; fi
          python3 scripts/package-shell-release.py \
            --bin-dir target/armv7-unknown-linux-gnueabihf/release \
            --target armv7-unknown-linux-gnueabihf --runner /usr/bin/qemu-arm \
            --output target/arm-shell-release --tag "$RELEASE_TAG" $transition
      - name: Verify release legal notices
        run: |
          # Notices are staged with the canonical x86_64 payload and are
          # uploaded once so no release asset basename is duplicated.
          for name in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt; do
            test -f "target/shell-release/$name"
          done
      - name: Create draft for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to modify a published release. Review a separately authorized release version." >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" target/shell-release/* target/arm-shell-release/* --clobber
          else
            prerelease_flag=
            case "$RELEASE_TAG" in *-*) prerelease_flag=--prerelease ;; esac
            gh release create "$RELEASE_TAG" $prerelease_flag target/shell-release/* target/arm-shell-release/* \
              --verify-tag --draft --title "$RELEASE_TAG" \
              --notes "Vitrallis Shell, Terminal, Notepad, Files and shared Arti bundles with SHA-256 checksums for Linux x86-64 and ARMv7, plus matching ARMv7 session installation/removal helpers and the project LICENSE and third-party notices. Requires glibc 2.36+ and SDL2 2.26.5+. Review and test artifacts before publishing."
          fi
